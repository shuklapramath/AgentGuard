name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build host binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/agentguard-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/agentguard-linux-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o dist/agentguard-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/agentguard-darwin-arm64 .
          (cd dist && sha256sum agentguard-linux-amd64 agentguard-linux-arm64 \
            agentguard-darwin-amd64 agentguard-darwin-arm64 > checksums.txt)
          file dist/*

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentguard-linux-amd64
            dist/agentguard-linux-arm64
            dist/agentguard-darwin-amd64
            dist/agentguard-darwin-arm64
            dist/checksums.txt
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux binaries for image
        run: |
          mkdir -p docker-context
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o docker-context/agentguard-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o docker-context/agentguard-arm64 .

      - id: ver
        run: echo "plain=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shuklapramath/agentguard:latest
            ghcr.io/shuklapramath/agentguard:${{ github.ref_name }}
            ghcr.io/shuklapramath/agentguard:${{ steps.ver.outputs.plain }}
